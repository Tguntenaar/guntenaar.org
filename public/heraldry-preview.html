<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guntenaar — coat of arms sketches</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f0e7; color: #403d35; font: 15px/1.6 Georgia, serif; }
    main { max-width: 1500px; margin: auto; padding: 44px 5vw 32px; }
    header { text-align: center; margin-bottom: 30px; }
    .eyebrow { font: 11px/1.5 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #797465; }
    h1 { font-weight: normal; font-size: clamp(28px, 4vw, 46px); line-height: 1.2; margin: 10px 0 12px; }
    header p { margin: 0; color: #797465; }
    .variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3vw; }
    figure { margin: 0; text-align: center; }
    .art { display: flex; aspect-ratio: 1; align-items: center; justify-content: center; padding: 12px; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; transition: transform .2s; }
    .art:hover img { transform: scale(1.025); }
    .art:focus-visible { outline: 2px solid #806a4c; outline-offset: 6px; }
    h2 { font-size: 23px; font-weight: normal; margin: 22px 0 5px; }
    figcaption p { color: #797465; margin: 0 auto; max-width: 28ch; font-size: 14px; }
    footer { text-align: center; margin-top: 40px; color: #797465; font-size: 13px; }
    footer a { color: inherit; text-underline-offset: 4px; }
    @media (max-width: 720px) { main { padding: 28px 6vw; } .variants { grid-template-columns: 1fr; gap: 38px; max-width: 460px; margin: auto; } }
    @media (prefers-reduced-motion: reduce) { img { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Guntenaar · family crest</div>
      <h1>Three sketches for our coat of arms.</h1>
      <p>Amsterdam roots. Four makers. One family.</p>
    </header>
    <div class="variants">
      <figure>
        <a class="art" href="heraldry/01-classic-amsterdam.webp" aria-label="View Classic Amsterdam at full size">
          <img src="heraldry/01-classic-amsterdam.webp" width="1254" height="1254" alt="Watercolor Guntenaar crest with two lions, an imperial crown and a shield of family professions around Amsterdam's three crosses.">
        </a>
        <figcaption><h2>01 · Classic Amsterdam</h2><p>The lions, the crown, and four crafts gathered on one shield.</p></figcaption>
      </figure>
      <figure>
        <a class="art" href="heraldry/02-canal-house.webp" aria-label="View Canal House at full size">
          <img src="heraldry/02-canal-house.webp" width="1254" height="1254" alt="Watercolor Guntenaar crest crowned with Amsterdam canal houses and surrounded by symbols for photography, accounting, drones and software.">
        </a>
        <figcaption><h2>02 · Canal House</h2><p>Our Amsterdam rooftops become the crown.</p></figcaption>
      </figure>
      <figure>
        <a class="art" href="heraldry/03-compact-shield.webp" aria-label="View Compact Shield at full size">
          <img src="heraldry/03-compact-shield.webp" width="1254" height="1254" alt="Simple watercolor Guntenaar shield with three Amsterdam crosses, a camera, ledger, drone, code brackets and a microchip.">
        </a>
        <figcaption><h2>03 · Compact Shield</h2><p>A quieter mark, made to sit lightly in the drawing.</p></figcaption>
      </figure>
    </div>
    <footer><a href="/?preview=desktop">Back to the canal</a></footer>
  </main>
</body>
</html>
